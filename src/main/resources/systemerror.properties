# Thông báo lỗi hệ thống — tra bởi MessageUtility.getSystemErrMsg(key).
# Lưu ý encoding: file này lưu UTF-8 thật (tiếng Việt có dấu, không escape
# unicode) — MessageUtility dùng ResourceBundle.Control tuỳ chỉnh để ép đọc
# UTF-8 (ResourceBundle.getBundle() mặc định đọc .properties theo ISO-8859-1).
MC000001 = Hệ thống gặp lỗi không xác định. Vui lòng thử lại sau.
MC000002 = Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
MC000003 = Tài khoản này không có quyền thực hiện thao tác này.
MC000004 = Dữ liệu đang được người khác cập nhật, vui lòng thử lại.
MC000006 = Yêu cầu không hợp lệ.
ME000037 = Đăng nhập thất bại. Sai tài khoản hoặc mật khẩu.
ME000014 = %1 không tồn tại.
ME000047 = Tài khoản này đã bị xóa.
ME000116 = Dữ liệu bắt buộc, vui lòng nhập.
MS000002 = Lấy dữ liệu %1 thất bại.
MS000004 = Xóa %1 thất bại.
